<!-- skills-form.component.html -->
<form [formGroup]="skillsForm" (ngSubmit)="onSubmit()" class="skills-form">
  <div formArrayName="skills">
    <div *ngFor="let skill of skills.controls; let i=index" [formGroupName]="i" class="skill-item">
      <div class="form-group">
        <label for="skillName{{i}}">Skill Name:</label>
        <input
          id="skillName{{i}}"
          type="text"
          formControlName="skillName"
          class="form-control"
          [class.is-invalid]="skill.get('skillName')?.touched && skill.get('skillName')?.invalid">
        <div
          *ngIf="skill.get('skillName')?.touched && skill.get('skillName')?.invalid"
          class="invalid-feedback">
          Skill name is required
        </div>
      </div>

      <div class="form-group">
        <label for="experienceLevel{{i}}">Experience Level:</label>
        <select
          id="experienceLevel{{i}}"
          formControlName="experienceLevel"
          class="form-control">
          <option *ngFor="let level of experienceLevels" [value]="level">
            {{level}}
          </option>
        </select>
      </div>

      <button
        type="button"
        class="btn btn-danger"
        (click)="removeSkill(i)"
        [disabled]="skills.length === 1">
        Remove Skill
      </button>
    </div>
  </div>

  <button type="button" class="btn btn-secondary" (click)="addSkill()">
    Add Skill
  </button>

  <button type="submit" class="btn btn-primary">
    Submit
  </button>
</form>
