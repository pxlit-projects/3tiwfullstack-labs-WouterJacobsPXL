<div class="container mx-auto">
  <div class="flex items-center">
    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <div class="flex items-center">
        <input type="text" class="px-4 py-2 mr-2" placeholder="Email" name="email" [(ngModel)]="email">
        <input type="password" class="px-4 py-2 mr-2" placeholder="Password" name="password" [(ngModel)]="password">
        <button type="submit" class="ml-2 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Login</button>
      </div>
    </form>
  </div>
</div>
